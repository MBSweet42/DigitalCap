<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Worksheet: Privacy Settings</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', sans-serif; color: #333; line-height: 1.6; background: white; }
        .container { max-width: 800px; margin: 0 auto; padding: 30px; }
        .header { text-align: center; border-bottom: 3px solid #4ECDC4; padding-bottom: 20px; margin-bottom: 30px; }
        .title { font-size: 1.8rem; color: #4ECDC4; font-weight: bold; }
        .subtitle { color: #666; font-size: 0.95rem; }
        .activity { margin-bottom: 30px; page-break-inside: avoid; }
        .activity-title { font-size: 1.2rem; color: #4ECDC4; font-weight: bold; margin-bottom: 10px; }
        .instructions { background: #F0F8F8; padding: 12px; border-left: 4px solid #4ECDC4; margin-bottom: 15px; font-size: 0.95rem; }
        .app-card { border: 1px solid #ddd; padding: 15px; margin: 15px 0; border-radius: 6px; background: #f9f9f9; }
        .checklist { margin: 15px 0; }
        .check-item { margin: 10px 0; padding: 8px; background: white; border: 1px solid #e0e0e0; border-radius: 4px; }
        .answer-space { border-bottom: 1px solid #333; min-height: 50px; margin: 10px 0; }
        table { width: 100%; border-collapse: collapse; margin: 15px 0; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: left; }
        th { background: #4ECDC4; color: white; }
