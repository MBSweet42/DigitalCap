<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Worksheet: Your Digital Footprint</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Comic Sans MS', 'Segoe UI', sans-serif; color: #333; line-height: 1.6; background: white; }
        .container { max-width: 800px; margin: 0 auto; padding: 30px; }
        .header { text-align: center; border-bottom: 3px solid #FF6B6B; padding-bottom: 20px; margin-bottom: 30px; }
        .title { font-size: 1.8rem; color: #FF6B6B; font-weight: bold; }
        .subtitle { color: #666; font-size: 0.95rem; }
        .activity { margin-bottom: 30px; page-break-inside: avoid; }
        .activity-title { font-size: 1.2rem; color: #FFB703; font-weight: bold; margin-bottom: 10px; display: flex; align-items: center; gap: 8px; }
        .instructions { background: #FFFBF0; padding: 12px; border-left: 4px solid #FFB703; margin-bottom: 15px; font-size: 0.95rem; }
        .drawing-space { border: 2px dashed #FFB703; padding: 30px; height: 150px; margin: 15px 0; background: #FFFEF0; display: flex; align-items: center; justify-content: center; color: #999; text-align: center; }
        .checklist { margin: 15px 0; }
        .check-item { margin: 10px 0; padding: 8px; background: #f9f9f9; border-radius: 4px; }
        .answer-space { border-bottom: 1px solid #333; min-height: 50px; margin: 10px 0; }
